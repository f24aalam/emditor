[package]
name = "emditor-launcher"
version = "0.1.0"
license = "MIT"
edition = "2021"

[[bin]]
name = "emditor"
path = "src/main.rs"

[dependencies]
ctrlc = "3"
emditor-cli-protocol = { path = "../cli-protocol" }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }
